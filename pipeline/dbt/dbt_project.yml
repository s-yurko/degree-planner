name: 'dplanner'
version: '1.0.0'
config-version: 2

profile: 'dplanner'

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# +schema gives bare names (staging, not analytics_staging) via the generate_schema_name override
models:
  dplanner:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
